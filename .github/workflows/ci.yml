name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  HUSKY: '0'
  TSQLREFINE_VERSION: '1.1.0'

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Type checking is platform-dependent: forceConsistentCasingInFileNames
      # only catches wrong-cased imports on a case-insensitive filesystem, and
      # type resolution can differ per OS. Run it everywhere.
      - run: npm run typecheck

      # Lint, format and import-order checks are platform-independent
      # (line endings are pinned to LF by .gitattributes and biome.json);
      # run them once.
      - run: npm run check
        if: runner.os == 'Linux'

      # Run unit tests with coverage (Linux only for performance)
      - run: npm run test:unit:coverage
        if: runner.os == 'Linux'

      # Upload coverage report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Run unit tests without coverage on Windows/Mac
      - run: npm run test:unit
        if: runner.os != 'Linux'

      # Build once, then run E2E against the production bundle.
      # Packaging invokes vscode:prepublish, so it also performs the Linux build.
      - name: Build production extension (Windows/macOS)
        run: npm run build -- --production
        if: runner.os != 'Linux'
      - name: Package extension (Linux)
        run: npm run package
        if: runner.os == 'Linux'

      # Install .NET SDK and tsqlrefine CLI for E2E tests
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install tsqlrefine CLI
        run: dotnet tool install -g TSQLRefine --version ${{ env.TSQLREFINE_VERSION }}
      - name: Verify tsqlrefine installation
        run: tsqlrefine --version

      # Run E2E tests on Linux with xvfb
      - name: Run E2E tests (Linux)
        run: xvfb-run -a npm run test:e2e:run
        if: runner.os == 'Linux'

      - name: Run E2E tests on minimum supported VS Code (Linux)
        run: xvfb-run -a npm run test:e2e:run
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: minimum

      # Run E2E tests on Windows/macOS
      - name: Run E2E tests (Windows/macOS)
        run: npm run test:e2e:run
        if: runner.os != 'Linux'

      - name: Upload E2E logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: .vscode-test/**/logs/**
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: vsix-package
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7
